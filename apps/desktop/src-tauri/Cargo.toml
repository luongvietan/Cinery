[package]
name = "cinematic-desktop"
version = "0.0.0"
description = "AI Cinematic Production OS"
authors = ["cinematic"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mime_guess = "2"
base64 = "0.22"
ureq = { version = "2.12", features = ["json"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
semver = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[lib]
name = "cinematic_desktop_lib"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"

# MSVC link.exe PDB writing intermittently fails with LNK1318 under parallel
# or concurrent debug builds on this machine; disabling debug info for test
# builds removes the PDB entirely without affecting test behavior.
[profile.test]
debug = 0

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
